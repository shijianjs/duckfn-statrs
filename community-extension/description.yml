extension:
  name: duckfn_statrs
  description: Statistical functions from the Rust statrs crate - summary statistics over DOUBLE lists and the normal distribution
  version: 0.1.0
  language: Rust
  build: cargo
  license: MIT
  requires_toolchains: "rust;python3"
  maintainers:
    - shijianjs

repo:
  github: shijianjs/duckfn-statrs
  ref: <40-character commit SHA of the released version>

docs:
  hello_world: |
    -- Summary statistics take a LIST(DOUBLE)
    SELECT stat_mean([1.0, 2.0, 3.0]);
    -- 2.0

    SELECT stat_median(list(v) FILTER (WHERE v IS NOT NULL))
    FROM (VALUES (1.0), (2.0), (NULL), (3.0), (100.0)) t(v);
    -- 2.5

    -- Distribution functions take scalar parameters
    SELECT stat_normal_quantile(0.975, 0.0, 1.0);
    -- 1.9599639845400538
  extended_description: |
    Wraps the Rust statrs crate as DuckDB functions. Summary statistics take a `LIST(DOUBLE)` and
    return a `DOUBLE`: means (arithmetic, geometric, harmonic, quadratic), median and quantiles,
    sample and population variance / standard deviation, covariance. Distribution functions
    (currently the normal: pdf, cdf, quantile) take scalar `DOUBLE` arguments.

    NULL semantics: these are scalars, not aggregates - a NULL list, or a NULL element inside one,
    yields a NULL row; skip NULLs while building the list with `list(x) FILTER (WHERE x IS NOT
    NULL)`. A statistic statrs cannot define (empty list, variance of a single value, an
    out-of-range tau) comes back as NULL; invalid distribution parameters (std_dev <= 0, a
    probability outside [0, 1]) fail the query.

    Requires **DuckDB 1.3 or newer**: the extension is built against DuckDB 1.5.6 headers but
    declares the C API floor it needs (v1.2.0), so one binary loads into 1.3.2 through 1.5.6 alike.
    Development notes and the full function table live in the repository:
    <https://github.com/shijianjs/duckfn-statrs>.
